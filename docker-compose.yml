services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: artemis-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${SQLSERVER_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P '${SQLSERVER_SA_PASSWORD}' -Q 'SELECT 1' -C -N
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    volumes:
      - sqlserver-data:/var/opt/mssql
    restart: unless-stopped

  seq:
    image: datalust/seq:latest
    container_name: artemis-seq
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:5341"
      - "8081:80"
    volumes:
      - seq-data:/data
    restart: unless-stopped

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: artemis-azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data
    restart: unless-stopped

volumes:
  sqlserver-data:
  seq-data:
  azurite-data:
