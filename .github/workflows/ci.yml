name: CI (Continuous Integration) Pipeline

on:
    push:
        branches: [main, development]
    pull_request:
        branches: [main]

env:
    DOTNET_VERSION: "9.0.119"
    BUN_VERSION: "1.3.14"
    SOLUTION: ArtemisBankingPro.sln
    CONFIGURATION: Release

jobs:
    build:
        name: Build & Unit Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Install frontend dependencies
              working-directory: src/Presentation/ArtemisBankingPro.WebApp
              run: bun install --frozen-lockfile

            - name: Verify frontend build and checks
              working-directory: src/Presentation/ArtemisBankingPro.WebApp
              run: bun run check

            - name: Audit frontend dependencies
              working-directory: src/Presentation/ArtemisBankingPro.WebApp
              run: bun run audit

            - name: Restore
              run: dotnet restore ${{ env.SOLUTION }}

            - name: Build
              run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration ${{ env.CONFIGURATION }}

            - name: Restore local tools
              run: dotnet tool restore

            - name: Verify formatting
              run: dotnet format ${{ env.SOLUTION }} --verify-no-changes

            - name: Verify diff whitespace
              run: git diff --check

            - name: Check vulnerable packages
              run: dotnet list ${{ env.SOLUTION }} package --vulnerable --include-transitive

            - name: Run Unit Tests
              run: dotnet test tests/ArtemisBankingPro.UnitTests/ --no-build --configuration ${{ env.CONFIGURATION }} --logger "trx;LogFileName=unit-tests.trx"

            - name: Upload Unit Test Results
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: unit-test-results
                  path: "**/*.trx"
                  if-no-files-found: warn

    integration-tests:
        name: Integration Tests (SQL Server)
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Restore
              run: dotnet restore ${{ env.SOLUTION }}

            - name: Build
              run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration ${{ env.CONFIGURATION }}

            - name: Restore local tools
              run: dotnet tool restore

            - name: Run Integration Tests
              run: dotnet test tests/ArtemisBankingPro.IntegrationTests/ --no-build --configuration ${{ env.CONFIGURATION }} --logger "trx;LogFileName=integration-tests.trx"

            - name: Verify migration model state
              run: |
                  dotnet ef migrations has-pending-model-changes --project src/Infrastructure/ArtemisBankingPro.Infrastructure.Persistence/ArtemisBankingPro.Infrastructure.Persistence.csproj --configuration ${{ env.CONFIGURATION }}
                  dotnet ef migrations has-pending-model-changes --project src/Infrastructure/ArtemisBankingPro.Infrastructure.Identity/ArtemisBankingPro.Infrastructure.Identity.csproj --configuration ${{ env.CONFIGURATION }}
              env:
                  ARTEMIS_CONNECTION_STRING: "Server=localhost;Database=ArtemisMigrationDesign;User Id=sa;Password=REPLACE_WITH_LOCAL_PASSWORD;TrustServerCertificate=True"

            - name: Upload Integration Test Results
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: integration-test-results
                  path: "**/*.trx"
                  if-no-files-found: warn
