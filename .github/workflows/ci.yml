name: CI (Continuous Integration) Pipeline

on:
    push:
        branches: [main, development]
    pull_request:
        branches: [main]

env:
    DOTNET_VERSION: "9.0.x"
    SOLUTION: ArtemisBankingPro.sln
    CONFIGURATION: Release

jobs:
    build:
        name: Build & Unit Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Restore
              run: dotnet restore ${{ env.SOLUTION }}

            - name: Build
              run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration ${{ env.CONFIGURATION }}

            - name: Run Unit Tests
              run: dotnet test tests/ArtemisBankingPro.UnitTests/ --no-build --configuration ${{ env.CONFIGURATION }} --logger "trx;LogFileName=unit-tests.trx"

            - name: Upload Unit Test Results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: unit-test-results
                  path: "**/*.trx"
                  if-no-files-found: warn

    integration-tests:
        name: Integration Tests (SQL Server)
        runs-on: ubuntu-latest
        needs: build
        services:
            sqlserver:
                image: mcr.microsoft.com/mssql/server:2022-latest
                env:
                    ACCEPT_EULA: Y
                    SA_PASSWORD: "Strong!Passw0rd"
                    MSSQL_PID: Developer
                ports:
                    - 1433:1433
                options: >-
                    --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P 'Strong!Passw0rd' -Q 'SELECT 1' -C -N"
                    --health-interval=15s
                    --health-timeout=10s
                    --health-retries=20
                    --health-start-period=60s
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Restore
              run: dotnet restore ${{ env.SOLUTION }}

            - name: Build
              run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration ${{ env.CONFIGURATION }}

            - name: Run Integration Tests
              run: dotnet test tests/ArtemisBankingPro.IntegrationTests/ --no-build --configuration ${{ env.CONFIGURATION }} --logger "trx;LogFileName=integration-tests.trx"
              env:
                  ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=ArtemisBankingPro_Tests;User=SA;Password=Strong!Passw0rd;TrustServerCertificate=True;Encrypt=False"

            - name: Upload Integration Test Results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: integration-test-results
                  path: "**/*.trx"
                  if-no-files-found: warn
